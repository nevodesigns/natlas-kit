[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "natlas-kit"
version = "0.1.0"
description = "A community developer toolkit that makes NCAIR's N-ATLaS language and speech models easy to build with."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "EgoTrack team" }]
keywords = ["n-atlas", "natlas", "nigeria", "llm", "yoruba", "hausa", "igbo", "pidgin", "nitda", "ncair", "asr"]
dependencies = ["requests>=2.20"]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.23"]
dev = ["pytest>=6"]

[project.scripts]
natlas = "natlaskit.cli:main"

[project.urls]
Homepage = "https://github.com/nevodesigns/natlas-kit"
"N-ATLaS model" = "https://huggingface.co/NCAIR1/N-ATLaS"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
natlaskit = ["py.typed"]
