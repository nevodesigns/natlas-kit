name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install .[dev]
      - name: Test (offline, mock backend)
        run: pytest -q
      - name: Smoke-test the CLI and examples
        run: |
          natlas version
          python examples/quickstart.py
          python examples/egotrack_voice_to_ledger.py
          natlas --backend mock eval evals/suite_core.json || true
